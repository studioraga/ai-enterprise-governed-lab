[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-enterprise-governed-lab"
version = "0.1.0"
description = "Reviewable local feasibility baseline, NOT a production release"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyyaml>=6,<7"]
[tool.setuptools.packages.find]
include = ["feasibility*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
