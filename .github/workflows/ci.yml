name: Baseline checks (no deployment authority)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  wp0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: bash scripts/verify_baseline.sh
