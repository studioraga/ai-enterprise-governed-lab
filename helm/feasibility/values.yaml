replicaCount: 1
image:
  repository: ai-enterprise-feasibility
  tag: local
  pullPolicy: IfNotPresent
service:
  port: 8000
serviceAccount:
  create: true
networkPolicy:
  enabled: true
  # kind default CNI does not guarantee enforcement; verify CNI before claiming isolation.
  # All egress denied; ingress only from same namespace for TCP 8000.
resources:
  requests:
    cpu: 100m
    memory: 96Mi
  limits:
    cpu: 500m
    memory: 256Mi
